name: Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python and Sphinx
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Install graph rendering tools
        run: |
          sudo apt-get update
          packages=(graphviz librsvg2-bin)
          # Ubuntu 26.04 splits circo's layout plugin out of graphviz.
          if apt-cache show libgvplugin-neato-layout8 > /dev/null 2>&1; then
            packages+=(libgvplugin-neato-layout8)
          fi
          sudo apt-get install -y "${packages[@]}"

      - name: Verify Graphviz rendering
        run: |
          for engine in dot circo; do
            for format in svg pdf; do
              printf 'digraph { a -> b }\n' | "$engine" -T"$format" \
                -o "$RUNNER_TEMP/$engine.$format"
              test -s "$RUNNER_TEMP/$engine.$format"
            done
          done

      - name: Run tox
        run: python -m tox run-parallel -f tests --parallel auto --parallel-no-spinner

  web-components:
    name: Web Components
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Web Component tests
        run: npm run test:web-components
