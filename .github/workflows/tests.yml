name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python and Sphinx
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Install graph rendering tools
        run: sudo apt-get update && sudo apt-get install -y graphviz librsvg2-bin

      - name: Run tox
        run: python -m tox

      - name: Upload tested HTML author guide
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: author-guide-html
          path: .tox/py3.13-sphinx9.1-docs-html/tmp/authorguide-html
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  web-components:
    name: Web Components
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Web Component tests
        run: npm run test:web-components
