name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish, and release
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/sphinx-touchbook/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: python -m pip install ".[test,docs,publish]"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run directives tests
        run: python -m pytest tests/test_*.py

      - name: Run Web Component tests
        run: npm run test:web-components

      - name: Build HTML author guide
        run: python -m sphinx -b html docs build/authorguide --fail-on-warning

      - name: Build PDF author guide
        run: |
          docker run --rm \
            -v "$PWD:/docs" \
            -w /docs \
            sphinxdoc/sphinx-latexpdf:latest \
            sh -c 'python -m pip install ".[docs]" && python -m sphinx -M latexpdf docs build/latexpdf --fail-on-warning'
          mkdir -p build/release-assets
          find build/latexpdf/latex -name '*.pdf' -exec cp {} build/release-assets/ \;

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*
          build/release-assets/*.pdf
          --title "$GITHUB_REF_NAME"
          --generate-notes
