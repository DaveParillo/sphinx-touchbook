name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publish author guide
    needs: tests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/publish-authorguide.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    name: Publish package and release
    needs: [tests, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    environment:
      name: pypi
      url: https://pypi.org/project/sphinx-touchbook/

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[publish]"

      - name: Download author guide from this pipeline
        uses: actions/download-artifact@v8
        with:
          name: author-guide
          path: build/authorguide

      - name: Verify release PDF
        run: test -s build/authorguide/_downloads/sphinxtouchbookauthorguide.pdf

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*
          build/authorguide/_downloads/sphinxtouchbookauthorguide.pdf
          --title "$GITHUB_REF_NAME"
          --generate-notes
