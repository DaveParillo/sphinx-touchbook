name: Publish Author Guide

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build HTML and PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install graph rendering tools
        run: sudo apt-get update && sudo apt-get install -y graphviz librsvg2-bin

      - name: Install author guide dependencies
        run: python -m pip install ".[docs]" "Sphinx>=9.1,<9.2"

      - name: Build HTML author guide
        run: python -m sphinx -E -b html docs build/authorguide --fail-on-warning

      - name: Build PDF author guide
        run: |
          python -m sphinx -M latex docs build/latexpdf \
            -D tb_pdf_tagging=1 --fail-on-warning
          docker run --rm \
            -v "$PWD:/docs" \
            -w /docs/build/latexpdf/latex \
            texlive/texlive:latest \
            make all-pdf
          test -s build/latexpdf/latex/sphinxtouchbookauthorguide.pdf
          mkdir -p build/authorguide/_downloads
          cp build/latexpdf/latex/sphinxtouchbookauthorguide.pdf \
            build/authorguide/_downloads/

      - name: Verify Pages artifact root
        run: |
          test -s build/authorguide/index.html
          test -s build/authorguide/_downloads/sphinxtouchbookauthorguide.pdf
          touch build/authorguide/.nojekyll

      - name: Upload HTML and PDF author guide
        uses: actions/upload-artifact@v7
        with:
          name: author-guide
          path: build/authorguide
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy author guide
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download HTML and PDF author guide
        uses: actions/download-artifact@v8
        with:
          name: author-guide
          path: build/authorguide

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/authorguide

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
