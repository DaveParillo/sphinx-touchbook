name: Publish Author Guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build author guide
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Build HTML author guide
        run: |
          python -m tox -e py3.13-sphinx9.1-docs-html
          mkdir -p build
          cp -R .tox/py3.13-sphinx9.1-docs-html/tmp/authorguide-html build/authorguide
          echo "Disable Jekyll processing"
          touch build/authorguide/.nojekyll

      - name: Build PDF author guide
        run: |
          python -m pip install ".[docs]" "Sphinx>=9.1,<9.2"
          python -m sphinx -M latex docs build/latexpdf \
            -D tb_pdf_tagging=1 --fail-on-warning
          docker run --rm \
            -v "$PWD:/docs" \
            -w /docs/build/latexpdf/latex \
            texlive/texlive:latest \
            make all-pdf
          test -s build/latexpdf/latex/sphinxtouchbookauthorguide.pdf
          mkdir -p build/authorguide/_downloads
          cp build/latexpdf/latex/sphinxtouchbookauthorguide.pdf \
            build/authorguide/_downloads/

      - name: Verify Pages artifact root
        run: test -f build/authorguide/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/authorguide

  deploy:
    name: Deploy author guide
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
