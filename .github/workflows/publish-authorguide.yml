name: Publish Author Guide

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build author guide
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install graph rendering tools
        run: sudo apt-get update && sudo apt-get install -y graphviz librsvg2-bin

      - name: Download tested HTML author guide
        uses: actions/download-artifact@v8
        with:
          name: author-guide-html
          path: build/authorguide
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Disable Jekyll processing
        run: touch build/authorguide/.nojekyll

      - name: Build PDF author guide
        run: |
          python -m pip install ".[docs]" "Sphinx>=9.1,<9.2"
          python -m sphinx -M latex docs build/latexpdf \
            -D tb_pdf_tagging=1 --fail-on-warning
          docker run --rm \
            -v "$PWD:/docs" \
            -w /docs/build/latexpdf/latex \
            texlive/texlive:latest \
            make all-pdf
          test -s build/latexpdf/latex/sphinxtouchbookauthorguide.pdf
          mkdir -p build/authorguide/_downloads
          cp build/latexpdf/latex/sphinxtouchbookauthorguide.pdf \
            build/authorguide/_downloads/

      - name: Verify Pages artifact root
        run: test -f build/authorguide/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/authorguide

  deploy:
    name: Deploy author guide
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
