[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinx-touchbook"
version = "0.2.2"
description = "Sphinx directives and Web Components for interactive textbook content."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Dave Parillo", email="dparillo@sdccd.edu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Education",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Education",
]
dependencies = [
    "Sphinx>=8.1",
]

[project.urls]
Homepage = "https://github.com/DaveParillo/sphinx-touchbook"
Issues = "https://github.com/DaveParillo/sphinx-touchbook/issues"

[project.optional-dependencies]
test = [
    "beautifulsoup4",
    "pytest",
]
docs = [
    "Sphinx>=8.1",
    "sphinx-nefertiti",
]
publish = [
    "build",
    "hatchling",
    "twine",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build]
exclude = [
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/docs",
    "/package.json",
    "/package-lock.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_touchbook"]
